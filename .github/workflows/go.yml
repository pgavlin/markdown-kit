on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OS: ${{ matrix.os }}
      GOFLAGS: -tags=sqlite_fts5
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install sqlite3 headers (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $url = "https://www.sqlite.org/2026/sqlite-amalgamation-3510200.zip"
        $zip = "$env:RUNNER_TEMP\sqlite.zip"
        $dir = "$env:RUNNER_TEMP\sqlite"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        $include = "$dir\sqlite-amalgamation-3510200" -replace '\\', '/'
        "CGO_CFLAGS=-I$include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Check formatting
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        go install mvdan.cc/gofumpt@latest
        test -z "$(gofumpt -l .)"
    - name: Vet
      run: go vet ./...
    - name: Build
      run: go build ./...
    - name: Test
      run: go test ./... -coverprofile=coverage.out
    - name: Upload coverage data
      if: ${{ matrix.os != 'windows-latest' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        fail_ci_if_error: true
        verbose: true
        env_vars: OS
